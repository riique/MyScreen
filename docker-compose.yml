services:
  # Aplica o schema ANTES do app atender trafego.
  #
  # O `npx prisma db push` que rodava dentro do container `app` nao podia
  # funcionar: o stage `runner` do Dockerfile copia apenas `public`, `prisma`,
  # `.next/standalone` e `.next/static`, e a CLI do Prisma e uma devDependency
  # que nada importa — entao o `npx` resolvia o pacote do registry em tempo de
  # deploy (ou falhava sem rede). Alem disso o schema era aplicado DEPOIS de o
  # app ja responder: nesse intervalo todo endpoint que fala com o Prisma
  # devolvia 500.
  #
  # Este servico usa o stage `deps` do Dockerfile, que tem a CLI pinada pelo
  # package-lock, e roda uma vez e sai.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    env_file:
      - .env
    # O path do SQLite e declarado AQUI, e nao no `.env`: um `file:./...`
    # relativo e resolvido pelo Prisma contra o diretorio do schema
    # (`/app/prisma/`), que nao e o volume `app-data:/app/data` — o banco
    # nasceria fora do volume e sumiria a cada `up --build`, levando
    # salas e senhas junto.
    environment:
      DATABASE_URL: "file:/app/data/database.sqlite"
    volumes:
      - app-data:/app/data
    command: ["npx", "--no-install", "prisma", "db", "push", "--skip-generate"]
    restart: "no"
    networks:
      - myscreen-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/database.sqlite"
      # Derivada do DOMAIN, nunca do `.env`. Um `.env` reaproveitado de
      # desenvolvimento carrega `ws://localhost:7880`, e o `deploy.sh` so
      # escreve esta variavel quando o arquivo NAO existe — em producao o
      # navegador receberia `ws://localhost/rtc/v1` e a sinalizacao nunca
      # abriria. Como o Caddy so encaminha `/rtc*` para o SFU e o SDK anexa
      # `/rtc/v1`, `wss://<DOMAIN>` e exatamente a URL publica correta.
      NEXT_PUBLIC_LIVEKIT_URL: "wss://${DOMAIN:-localhost}"
    volumes:
      - app-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - myscreen-network
    healthcheck:
      # 127.0.0.1 e nao localhost: o Next.js standalone escuta so em IPv4
      # (0.0.0.0) e o busybox do alpine resolve `localhost` para ::1
      # primeiro, onde ninguem escuta — o healthcheck falha com "connection
      # refused" num app saudavel. O `caddy` depende de service_healthy,
      # entao a borda nunca subiria.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Rotacao de log nao e opcional: sem `max-size` o driver json-file cresce ate
    # encher o disco — e quando o disco enche, o SQLite vai junto.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # NAO publique 7880/7881 em 0.0.0.0. O Caddy ja faz o front da sinalizacao
    # (/rtc) e o 7880 responde token com roomAdmin. Alem disso, o Docker insere
    # DNAT + chain DOCKER ANTES das regras do UFW: tudo que esta em `ports`
    # fica alcancavel da internet mesmo com o firewall "fechado". Remover a
    # exposicao e melhor do que remendar com regras DOCKER-USER.
    #
    # 3478/tcp e 5349/tcp sao o TURN (STUN e STUN/TLS). O range 50000-60000/udp
    # e a midia WebRTC. Essas tres sao as unicas que o SFU precisa expor.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "50000-60000:50000-60000/udp"
      - "61000-62000:61000-62000/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - myscreen-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - myscreen-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  myscreen-network:
    driver: bridge

volumes:
  app-data:
  caddy-data:
  caddy-config:
