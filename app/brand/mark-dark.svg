<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="MyScreen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#f3f4f7"/><stop offset="1" stop-color="#e1e4eb"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.0"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a4d"/><stop offset="0.6" stop-color="#171a24"/><stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="live" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ff6a5f"/><stop offset="0.6" stop-color="#e83a2f"/><stop offset="1" stop-color="#c42a21"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5145" stop-opacity="0.35"/><stop offset="1" stop-color="#ff5145" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.18"/></filter>
    <clipPath id="tile"><path d="M230 0 H794 C921 0 1024 103 1024 230 V794 C1024 921 921 1024 794 1024 H230 C103 1024 0 921 0 794 V230 C0 103 103 0 230 0 Z"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#spot)"/>
    <!-- luz que a tela derrama no fundo -->
    <rect x="196" y="300" width="632" height="400" rx="96" fill="#0f111a" opacity="0.2" filter="url(#bloom)"/>
  </g>
  <path d="M230 0 H794 C921 0 1024 103 1024 230 V794 C1024 921 921 1024 794 1024 H230 C103 1024 0 921 0 794 V230 C0 103 103 0 230 0 Z" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- pé -->
  <rect x="417" y="768" width="190" height="30" rx="15" fill="#0f111a" opacity="0.16"/>

  <!-- tela -->
  <rect x="162" y="262" width="700" height="452" rx="92" fill="url(#screen)" filter="url(#drop)"/>
  <rect x="164" y="264" width="696" height="448" rx="90" fill="none" stroke="url(#gloss)" stroke-width="4"/>

  <!-- transmitindo -->
  <path d="M604.1 405.0 A124 124 0 0 1 604.1 571.0" fill="none" stroke="#ffffff" stroke-opacity="1" stroke-width="36" stroke-linecap="round"/><path d="M419.9 405.0 A124 124 0 0 0 419.9 571.0" fill="none" stroke="#ffffff" stroke-opacity="1" stroke-width="36" stroke-linecap="round"/><path d="M663.6 351.5 A204 204 0 0 1 663.6 624.5" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="36" stroke-linecap="round"/><path d="M360.4 351.5 A204 204 0 0 0 360.4 624.5" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="36" stroke-linecap="round"/>
  <circle cx="512" cy="488" r="120" fill="url(#halo)"/>
  <circle cx="512" cy="488" r="58" fill="url(#live)"/>
  <ellipse cx="495" cy="467" rx="22" ry="13" fill="#ffffff" opacity="0.28" transform="rotate(-28 495 467)"/>
</svg>
