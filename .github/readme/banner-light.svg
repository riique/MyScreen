<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="MyScreen — sua tela, ao vivo.">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef0f4"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.2" fill="#0f111a" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="dotsMask"><rect width="1280" height="440" fill="url(#fade)"/></mask>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#bannerBg)"/>
    <rect width="1280" height="440" fill="url(#dots)" mask="url(#dotsMask)"/>
    <circle cx="272" cy="220" r="150" fill="#0f111a" opacity="0.06" filter="url(#soft)"/>
    <circle cx="272" cy="196" r="70" fill="#e0362c" opacity="0.10" filter="url(#soft)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="27.5" fill="none" stroke="#e6e8ed"/>

  <g filter="url(#iconShadow)">
    <svg x="152" y="100" width="240" height="240" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b3b"/><stop offset="0.5" stop-color="#12141c"/><stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <radialGradient id="ispot" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="irim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iscreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#eef0f5"/><stop offset="1" stop-color="#d5dae4"/>
    </linearGradient>
    <linearGradient id="igloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ilive" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ff6a5f"/><stop offset="0.6" stop-color="#e83a2f"/><stop offset="1" stop-color="#c42a21"/>
    </radialGradient>
    <radialGradient id="ihalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5145" stop-opacity="0.35"/><stop offset="1" stop-color="#ff5145" stop-opacity="0"/>
    </radialGradient>
    <filter id="ibloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="idrop" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="itile"><path d="M230 0 H794 C921 0 1024 103 1024 230 V794 C1024 921 921 1024 794 1024 H230 C103 1024 0 921 0 794 V230 C0 103 103 0 230 0 Z"/></clipPath>
  </defs>

  <g clip-path="url(#itile)">
    <rect width="1024" height="1024" fill="url(#ibg)"/>
    <rect width="1024" height="1024" fill="url(#ispot)"/>
    <!-- luz que a tela derrama no fundo -->
    <rect x="196" y="300" width="632" height="400" rx="96" fill="#c9d4ff" opacity="0.28" filter="url(#ibloom)"/>
  </g>
  <path d="M230 0 H794 C921 0 1024 103 1024 230 V794 C1024 921 921 1024 794 1024 H230 C103 1024 0 921 0 794 V230 C0 103 103 0 230 0 Z" fill="none" stroke="url(#irim)" stroke-width="6"/>

  <!-- pé -->
  <rect x="417" y="768" width="190" height="30" rx="15" fill="#ffffff" opacity="0.22"/>

  <!-- tela -->
  <rect x="162" y="262" width="700" height="452" rx="92" fill="url(#iscreen)" filter="url(#idrop)"/>
  <rect x="164" y="264" width="696" height="448" rx="90" fill="none" stroke="url(#igloss)" stroke-width="4"/>

  <!-- transmitindo -->
  <path d="M604.1 405.0 A124 124 0 0 1 604.1 571.0" fill="none" stroke="#0f111a" stroke-opacity="1" stroke-width="36" stroke-linecap="round"/><path d="M419.9 405.0 A124 124 0 0 0 419.9 571.0" fill="none" stroke="#0f111a" stroke-opacity="1" stroke-width="36" stroke-linecap="round"/><path d="M663.6 351.5 A204 204 0 0 1 663.6 624.5" fill="none" stroke="#0f111a" stroke-opacity="0.42" stroke-width="36" stroke-linecap="round"/><path d="M360.4 351.5 A204 204 0 0 0 360.4 624.5" fill="none" stroke="#0f111a" stroke-opacity="0.42" stroke-width="36" stroke-linecap="round"/>
  <circle cx="512" cy="488" r="120" fill="url(#ihalo)"/>
  <circle cx="512" cy="488" r="58" fill="url(#ilive)"/>
  <ellipse cx="495" cy="467" rx="22" ry="13" fill="#ffffff" opacity="0.28" transform="rotate(-28 495 467)"/>
</svg>
  </g>

  <g font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
    <g transform="translate(468 112)">
      <rect width="104" height="34" rx="17" fill="#fdeeec" stroke="#f4b9b3"/>
      <circle cx="21" cy="17" r="5" fill="#e0362c">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="22.5" font-size="14" font-weight="600" letter-spacing="1.6" fill="#c42a21">NO AR</text>
    </g>
    <text x="464" y="226" font-size="92" font-weight="700" letter-spacing="-3.5" fill="#0f111a">MyScreen</text>
    <text x="468" y="278" font-size="32" font-weight="400" letter-spacing="-0.6" fill="#464c5e">Sua tela, ao vivo.</text>
    <text x="468" y="330" font-size="19" font-weight="400" fill="#656b7e">Tela, som do sistema e câmera na mesma sala — no navegador ou no app de Windows.</text>
  </g>
</svg>
