<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279 372" width="1279" height="372" role="img" aria-label="Recursos do MyScreen">
  <g font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
  <g transform="translate(0.5 0.5)">
    <rect width="412" height="175" rx="18" fill="#ffffff" stroke="#e6e8ed"/>
    <rect x="28" y="28" width="48" height="48" rx="12" fill="#f4f5f7"/>
    <g transform="translate(40 40)" fill="none" stroke="#0f111a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.033 9.44a.647.647 0 0 1 0 1.12l-4.065 2.352a.645.645 0 0 1-.968-.56V7.648a.645.645 0 0 1 .967-.56z"/><path d="M12 17v4"/><path d="M8 21h8"/><rect x="2" y="3" width="20" height="14" rx="2"/></g>
    <text x="28" y="112" font-size="20" font-weight="600" letter-spacing="-0.3" fill="#0f111a">Tela a 60 FPS</text>
    <text x="28" y="140" font-size="15" fill="#464c5e">Tela inteira, janela ou aba, até 4K, com o</text>
    <text x="28" y="161" font-size="15" fill="#464c5e">codec escolhido pela sua placa de vídeo.</text>
  </g>
  <g transform="translate(433.5 0.5)">
    <rect width="412" height="175" rx="18" fill="#ffffff" stroke="#e6e8ed"/>
    <rect x="28" y="28" width="48" height="48" rx="12" fill="#f4f5f7"/>
    <g transform="translate(40 40)" fill="none" stroke="#0f111a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></g>
    <text x="28" y="112" font-size="20" font-weight="600" letter-spacing="-0.3" fill="#0f111a">Som do sistema sem eco</text>
    <text x="28" y="140" font-size="15" fill="#464c5e">Só o som da janela que você escolheu.</text>
    <text x="28" y="161" font-size="15" fill="#464c5e">A voz da chamada fica fora da captura.</text>
  </g>
  <g transform="translate(866.5 0.5)">
    <rect width="412" height="175" rx="18" fill="#ffffff" stroke="#e6e8ed"/>
    <rect x="28" y="28" width="48" height="48" rx="12" fill="#f4f5f7"/>
    <g transform="translate(40 40)" fill="none" stroke="#0f111a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.1 12 6"/><path d="m5.1 8-2.9-.8"/><path d="m6 12-1.9 2"/><path d="M7.2 2.2 8 5.1"/><path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z"/></g>
    <text x="28" y="112" font-size="20" font-weight="600" letter-spacing="-0.3" fill="#0f111a">Controle remoto</text>
    <text x="28" y="140" font-size="15" fill="#464c5e">Mouse, teclado e Ctrl+V entre os PCs,</text>
    <text x="28" y="161" font-size="15" fill="#464c5e">só depois que a pessoa clica em Permitir.</text>
  </g>
  <g transform="translate(0.5 196.5)">
    <rect width="412" height="175" rx="18" fill="#ffffff" stroke="#e6e8ed"/>
    <rect x="28" y="28" width="48" height="48" rx="12" fill="#fdeeec"/>
    <g transform="translate(40 40)" fill="none" stroke="#e0362c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="12" r="10"/></g>
    <text x="28" y="112" font-size="20" font-weight="600" letter-spacing="-0.3" fill="#0f111a">Gravação em MP4</text>
    <text x="28" y="140" font-size="15" fill="#464c5e">Cada câmera e cada tela da sala vira</text>
    <text x="28" y="161" font-size="15" fill="#464c5e">um arquivo MP4 separado na pasta Vídeos.</text>
  </g>
  <g transform="translate(433.5 196.5)">
    <rect width="412" height="175" rx="18" fill="#ffffff" stroke="#e6e8ed"/>
    <rect x="28" y="28" width="48" height="48" rx="12" fill="#f4f5f7"/>
    <g transform="translate(40 40)" fill="none" stroke="#0f111a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></g>
    <text x="28" y="112" font-size="20" font-weight="600" letter-spacing="-0.3" fill="#0f111a">Salas sem conta</text>
    <text x="28" y="140" font-size="15" fill="#464c5e">Crie a sala e mande o link. Sem cadastro,</text>
    <text x="28" y="161" font-size="15" fill="#464c5e">com senha opcional por sala.</text>
  </g>
  <g transform="translate(866.5 196.5)">
    <rect width="412" height="175" rx="18" fill="#ffffff" stroke="#e6e8ed"/>
    <rect x="28" y="28" width="48" height="48" rx="12" fill="#f4f5f7"/>
    <g transform="translate(40 40)" fill="none" stroke="#0f111a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g>
    <text x="28" y="112" font-size="20" font-weight="600" letter-spacing="-0.3" fill="#0f111a">Servidor próprio</text>
    <text x="28" y="140" font-size="15" fill="#464c5e">LiveKit com TURN embutido, Next.js e</text>
    <text x="28" y="161" font-size="15" fill="#464c5e">Caddy no seu Ubuntu.</text>
  </g>
  </g>
</svg>
